[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tally"
version = "1.0.0"
description = "A quiet, local log of everything you watch."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
windows = ["psutil"]

[project.scripts]
tally = "tally.__main__:main"

[tool.setuptools.packages.find]
include = ["tally*"]

[tool.setuptools.package-data]
tally = ["web/*"]
