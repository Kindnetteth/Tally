  <script>
    // Apply the saved look before anything paints (the page confirms it from /api/prefs)
    try {
      const p = JSON.parse(localStorage.getItem("tally-look") || "{}");
      if (p.theme && p.theme !== "system") document.documentElement.dataset.theme = p.theme;
      document.documentElement.dataset.accent = p.accent || "orchid";
    } catch (e) { document.documentElement.dataset.accent = "orchid"; }
  </script>
